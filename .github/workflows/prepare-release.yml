name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.000.001 (PS5 padding is automatic)'
        required: true
        type: string
  push:
    branches: [main]
    paths: ['sce_sys/param.json']

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare version and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag=$(python3 tools/ci/prepare-version.py "$RELEASE_VERSION")
          branch="release/$tag"
          if git diff --quiet; then
            echo "Version $tag is already prepared; no changes to propose."
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sce_sys/param.json README.md docs/CHANGELOG.md
          git commit -m "Prepare $tag"
          git push -u origin "$branch"
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## What changes
          Prepare $tag and its PS5 package version from main.

          ## Before merging
          Review the changelog and build results. Merging this version change creates the matching tag and starts the release build automatically.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Prepare $tag" --body-file "$RUNNER_TEMP/release-pr.md"
          # A PR created by GITHUB_TOKEN does not itself trigger pull_request workflows.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Tag the merged version and start its release build
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous=$(git show "$BEFORE:sce_sys/param.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["contentVersion"])')
          current=$(python3 -c 'import json; print(json.load(open("sce_sys/param.json"))["contentVersion"])')
          if [[ "$previous" == "$current" ]]; then
            echo 'Package version unchanged; no release tag to create.'
            exit 0
          fi
          tag=$(python3 -c 'import runpy,sys; print(runpy.run_path("tools/ci/prepare-version.py")["versions"](sys.argv[1])[1])' "$current")
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ $(git rev-parse "$tag^{commit}") != $(git rev-parse HEAD) ]]; then
              echo "::error::Tag $tag already points to another commit; it was not moved."
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          # GITHUB_TOKEN tag pushes do not trigger push workflows; dispatch explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
